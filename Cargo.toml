[package]
name = "arkiv-sdk"
version = "0.5.0"
edition = "2024"
description = "A Rust SDK for interacting with the Arkiv Network."
homepage = "https://arkiv.network/"
documentation = "https://docs.rs/arkiv_sdk"
repository = "https://github.com/arkiv-network/arkiv-sdk-rust"
license = "GPL-3.0-or-later"

[workspace]
members = ["demo", "test-utils"]
resolver = "2"

# This is available as a feature in the alloy crate, however,
# the macro expansion is broken as it doesn't rexport the crate
# name correctly and references `alloy_rlp` directly. It doesn't
# seem that they plan to fix it, so this must be locked at the
# version found in the Cargo.toml of the alloy crate to maintain
# compatibility.
#
# https://github.com/alloy-rs/rlp/issues/40
[dependencies.alloy-rlp]
features = ["derive"]
version = "0.3.12"

[dependencies]
alloy = { version = "1.0.24", features = [
  "provider-ws",
  "json-rpc",
  "signer-keystore",
] }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bigdecimal = "0.4"
bon = "3.6"
bytes = "1.10"
dirs = "6.0"
displaydoc = "0.2"
futures = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
url = "2.5"

[workspace.dependencies]
arkiv-sdk = { path = "." }
arkiv-test-utils = { path = "test-utils" }

[dev-dependencies]
bincode = "2"
expect-test = "1.5"
mime = "0.3"
serial_test = "3.2"
arkiv-test-utils = { workspace = true }
