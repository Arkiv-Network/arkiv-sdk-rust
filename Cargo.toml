[package]
name = "arkiv-sdk"
version = "0.5.0"
edition = "2024"
description = "A Rust SDK for interacting with the Arkiv Network."
homepage = "https://arkiv.network/"
documentation = "https://docs.rs/arkiv_sdk"
repository = "https://github.com/arkiv-network/arkiv-sdk-rust"
license = "GPL-3.0-or-later"

[workspace]
members = ["examples/keystore_signer", "examples/subscriptions"]
resolver = "2"

[features]
default = ["pubsub", "node-bindings"]
pubsub = ["alloy/pubsub"]
node-bindings = [
  "dep:reqwest",
  "dep:flate2",
  "dep:tar",
  "dep:dirs",
  "dep:tempfile",
]

# This is available as a feature in the alloy crate, however,
# the macro expansion is broken as it doesn't rexport the crate
# name correctly and references `alloy_rlp` directly. It doesn't
# seem that they plan to fix it, so this must be locked at the
# version found in the Cargo.toml of the alloy crate to maintain
# compatibility.
#
# https://github.com/alloy-rs/rlp/issues/40
[dependencies.alloy-rlp]
features = ["derive"]
version = "0.3.12"

[dependencies]
alloy = { version = "1.0.24", default-features = false, features = [
  "provider-ws",
  "json-rpc",
  "signer-keystore",
  "sol-types",
  "rpc-types",
  "reqwest",
] }
anyhow = "1.0"
async-trait = "0.1"
bigdecimal = "0.4"
bytes = "1.10"
dirs = { version = "6.0", optional = true }
flate2 = { version = "1", optional = true }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }

[workspace.dependencies]
arkiv-sdk = { path = "." }

[dev-dependencies]
bincode = "2"
expect-test = "1.5"
mime = "0.3"
serde_json = "1"
serial_test = "3.2"
